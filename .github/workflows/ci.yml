name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Test
        run: vendor/bin/phpunit

      # Los vectores compartidos entre los SDK: tests/vectors tiene que ser la
      # copia de la ÚLTIMA versión publicada de @lacasoft/coatipay-protocol (los
      # tests de arriba los pasan), y src/Errors/Catalogo.php el que se genera de
      # ella. Un vector nuevo hace fallar el CI hasta que se copie y se cumpla.
      - name: Shared vectors (latest published protocol)
        run: |
          npm pack @lacasoft/coatipay-protocol@latest --pack-destination "$RUNNER_TEMP" --silent > /dev/null
          tar -xzf "$RUNNER_TEMP"/lacasoft-coatipay-protocol-*.tgz -C "$RUNNER_TEMP"
          for f in "$RUNNER_TEMP"/package/vectors/*.json; do
            if ! diff -q "$f" "tests/vectors/$(basename "$f")" > /dev/null 2>&1; then
              echo "::error::tests/vectors/$(basename "$f") no es el de la última versión del protocolo. Cópialo y vuelve a generar el catálogo (php bin/generar-catalogo.php)."
              exit 1
            fi
          done
          php bin/generar-catalogo.php
          git diff --exit-code src/Errors/Catalogo.php
